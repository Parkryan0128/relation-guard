name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  implemented-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: relation_guard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/relation_guard_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-test.txt
      - name: Enable measured PostgreSQL query statistics
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d relation_guard_test -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; then break; fi
            sleep 1
          done
      - run: |
          mkdir -p target/test-results
          scripts/verify.sh | tee target/test-results/ci-regression.log
        env:
          QUERY_PLAN_OUTPUT: ${{ github.workspace }}/target/test-results/ci-query-plans.json
      - name: Native application recovery against the isolated PostgreSQL service
        run: |
          mkdir -p "$RUNNER_TEMP/rg-pg-client"
          for command in psql pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/rg-pg-client/$command" <<EOF
          #!/usr/bin/env bash
          exec docker exec -i ${{ job.services.postgres.id }} $command "\$@"
          EOF
            chmod 700 "$RUNNER_TEMP/rg-pg-client/$command"
          done
          PG_BIN="$RUNNER_TEMP/rg-pg-client" EXISTING_TEST_DATABASE_URL="$TEST_DATABASE_URL" RECOVERY_OUTPUT="$GITHUB_WORKSPACE/target/test-results/ci-native-recovery.json" python3 scripts/test_native_recovery.py | tee target/test-results/ci-recovery.log
          PG_BIN="$RUNNER_TEMP/rg-pg-client" EXISTING_TEST_DATABASE_URL="$TEST_DATABASE_URL" POOL_STALL_OUTPUT="$GITHUB_WORKSPACE/target/test-results/ci-pool-transport-stall.json" python3 scripts/test_pool_transport_stall.py | tee target/test-results/ci-pool-stall.log
          PG_BIN="$RUNNER_TEMP/rg-pg-client" EXISTING_TEST_DATABASE_URL="$TEST_DATABASE_URL" POOL_BURST_OUTPUT="$GITHUB_WORKSPACE/target/test-results/ci-pool-burst.json" python3 scripts/test_pool_burst.py | tee target/test-results/ci-pool-burst.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/test-results/ci-*.log
            target/test-results/ci-query-plans.json
            target/test-results/ci-native-recovery.json
            target/test-results/ci-pool-transport-stall.json
            target/test-results/ci-pool-burst.json
          retention-days: 30
  container-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned release image
        run: docker build -t relation-guard:local .
      - name: Verify isolated Compose restart and restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/test-results
          RG_RUN_DIR="$RUNNER_TEMP/relation-guard-compose" DEPLOYMENT_OUTPUT="$GITHUB_WORKSPACE/target/test-results/ci-deployment.json" python3 scripts/test_deployment.py | tee target/test-results/ci-deployment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification-evidence
          path: |
            target/test-results/ci-deployment.json
            target/test-results/ci-deployment.log
          retention-days: 30
