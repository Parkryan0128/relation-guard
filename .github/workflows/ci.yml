name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  implemented-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: relation_guard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/relation_guard_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements-test.txt
      - name: Enable measured PostgreSQL query statistics
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d relation_guard_test -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres; then break; fi
            sleep 1
          done
      - run: scripts/verify.sh
      - run: python scripts/check_docs.py
