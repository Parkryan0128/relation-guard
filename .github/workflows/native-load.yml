name: Native load verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-load:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: relation_guard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Build release binaries
        run: cargo build --release --locked --workspace
      - name: Install pinned k6 and PostgreSQL client wrappers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/k6.tar.gz"
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/rg-pg-client"
          for command in psql pg_dump pg_restore postgres; do
            cat > "$RUNNER_TEMP/rg-pg-client/$command" <<EOF
          #!/usr/bin/env bash
          exec docker exec -i ${{ job.services.postgres.id }} $command "\$@"
          EOF
            chmod 700 "$RUNNER_TEMP/rg-pg-client/$command"
          done
      - name: Full unchanged S and M profiles
        shell: bash
        env:
          EXISTING_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/relation_guard_test
        run: |
          set -euo pipefail
          mkdir -p target/test-results/ci-native-load
          PG_BIN="$RUNNER_TEMP/rg-pg-client" AUTHZ_BIN="$GITHUB_WORKSPACE/target/release" K6_BIN="$RUNNER_TEMP/k6-v2.3.0-linux-amd64/k6" RG_LOAD_DIR="$RUNNER_TEMP/load-private" RG_LOAD_OUTPUT="$GITHUB_WORKSPACE/target/test-results/ci-native-load" python3 scripts/run_native_load.py | tee target/test-results/ci-native-load.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-load-evidence
          path: |
            target/test-results/ci-native-load/
            target/test-results/ci-native-load.log
          retention-days: 30
